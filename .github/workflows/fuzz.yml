name: Fuzz

on:
  pull_request:
    branches: [main]
    types: [labeled]
  # On demand. Without this, the nightly is reachable only by waiting for the
  # cron or by labelling a PR `ci-fuzz` — so a cancelled nightly could not be
  # relaunched, only `gh run rerun`'d. That made cancelling the run a one-way
  # door on 2026-08-26, when the 02:00 UTC nightly held every hosted runner
  # through the working day and two PRs sat QUEUED behind it.
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Seconds per target (default 18000 = 5h, clamped to 18000)"
        required: false
        default: "18000"
  schedule:
    # 16:00 UTC = 23:00 in this project's timezone (UTC+7), so the soak runs
    # overnight LOCALLY and is done by ~04:50 local.
    #
    # It was '0 2 * * *' — 09:00 local, i.e. the start of the working day. The
    # nightly matrix is 18 jobs with `fail-fast: false` and no `max-parallel`,
    # each budgeted 5h, so it held 18 hosted runners from 09:00 to ~14:50 local
    # every weekday. Measured 2026-08-26 (moon#732): with the fuzz run 2.5h in
    # and all 18 jobs live, two CI runs sat `queued` for 35+ minutes while
    # `Check (Windows)` — a separate runner pool — completed normally. Every PR
    # raised in the morning paid that queue.
    #
    # Deliberately a reschedule and NOT a `max-parallel` cap: capping to 9 would
    # double the wall clock to ~11h40m and push the tail back into working hours,
    # which is the problem this is fixing.
    - cron: '0 16 * * *'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-pr:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-fuzz')
    name: Fuzz PR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - resp_parse
          - resp_parse_differential
          - inline_parse
          - wal_v3_record
          - gossip_deser
          - acl_rule
          - rdb_load
          - cypher_parse
          - conf_parse
          - csr_from_bytes
          - graph_props_record
          - fts_query_parse
          - mq_wal_record
          - ws_registry_record
          - mq_registry_blob
          - redis_rdb_load
          - term_fst_sidecar
          - dump_payload
          - acl_keyspec
          - ft_create_args
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Override rust-toolchain.toml for nightly
        run: rm -f rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz-nightly
      - name: Install cargo-fuzz
        # Prebuilt binary: `cargo install --locked` broke when nightly started
        # rejecting the lockfile's rustix 0.36.5 (reserved `rustc_*` attrs);
        # a binary install is immune to toolchain drift and faster.
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-fuzz
      - name: Download nightly corpus
        uses: actions/download-artifact@v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus/
        continue-on-error: true
      - name: Run fuzzer (15m, multi-process)
        # Explicit --target: the prebuilt cargo-fuzz binary is musl-linked and
        # self-detects musl as the default build target, whose std is not
        # installed (E0463 "can't find crate for `core`").
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time=900 -max_len=65536 -fork=2 -ignore_crashes=0
        env:
          MOON_NO_URING: "1"
          TARGET: ${{ matrix.target }}

  fuzz-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Fuzz nightly
    runs-on: ubuntu-latest
    # GitHub hard-kills a hosted job at 6h. A 6h fuzz budget therefore consumed the
    # entire allowance, so every long-running target was cancelled mid-run (measured
    # 2026-08-14: inline_parse / resp_parse / resp_parse_differential all ended at
    # 6h 00m 17s, conclusion `cancelled`), the step never returned, and `Archive
    # corpus` never ran — discarding the accumulated corpus every night. Only targets
    # that fail fast ever reported. An explicit budget below the platform ceiling
    # leaves room for setup, build, and archiving, and makes an overrun a clean job
    # timeout rather than a silent platform cancellation.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        target:
          - resp_parse
          - resp_parse_differential
          - inline_parse
          - wal_v3_record
          - gossip_deser
          - acl_rule
          - rdb_load
          - cypher_parse
          - conf_parse
          - csr_from_bytes
          - graph_props_record
          - fts_query_parse
          - mq_wal_record
          - ws_registry_record
          - mq_registry_blob
          - redis_rdb_load
          - term_fst_sidecar
          - dump_payload
          - acl_keyspec
          - ft_create_args
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Override rust-toolchain.toml for nightly
        run: rm -f rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz-nightly
      - name: Install cargo-fuzz
        # Prebuilt binary: `cargo install --locked` broke when nightly started
        # rejecting the lockfile's rustix 0.36.5 (reserved `rustc_*` attrs);
        # a binary install is immune to toolchain drift and faster.
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-fuzz
      - name: Download previous corpus
        uses: actions/download-artifact@v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus/
        continue-on-error: true
      - name: Run fuzzer (multi-process)
        # Explicit --target: see fuzz-pr note (prebuilt musl cargo-fuzz).
        # 5h, not 6h: the job's 350-minute ceiling must outlast fuzzing PLUS the
        # corpus archive, or the archive is lost with the job. See timeout-minutes.
        # A dispatch may shorten the budget but not lengthen it past 18000 --
        # otherwise the manual trigger could silently reintroduce the exact
        # archive-losing overrun that ceiling exists to prevent.
        run: |
          # `if`, not `[ ] && x`. Under `bash -e` (how Actions runs this) a
          # failing test inside an AND-OR list is exempt from -e, so the `&&`
          # form does survive today -- verified, not assumed. It survives only
          # because another command follows it: were the clamp ever to end the
          # block, its false branch would become the step's exit status and
          # fail the job. `if` does not depend on statement order.
          budget="${BUDGET:-18000}"
          case "$budget" in ''|*[!0-9]*) budget=18000 ;; esac
          # All-digits is not the same as comparable. A value wider than
          # intmax_t makes `[ -gt ]` fail with "integer expression expected",
          # BOTH clamps below then no-op, and the raw string reaches
          # `cargo fuzz` uncapped -- verified with a 100-digit input. Bound the
          # width first; 5 digits caps at 99999, which the -gt below reduces.
          if [ "${#budget}" -gt 5 ]; then budget=18000; fi
          if [ "$budget" -gt 18000 ]; then budget=18000; fi
          if [ "$budget" -lt 60 ]; then budget=60; fi
          echo "fuzzing $TARGET for ${budget}s"
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time="$budget" -max_len=65536 -fork=2 -ignore_crashes=0
        env:
          MOON_NO_URING: "1"
          TARGET: ${{ matrix.target }}
          BUDGET: ${{ inputs.duration_seconds }}
      - name: Archive corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus/
          retention-days: 30
