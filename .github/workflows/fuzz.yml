name: Fuzz

on:
  pull_request:
    branches: [main]
    types: [labeled]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-pr:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-fuzz')
    name: Fuzz PR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - resp_parse
          - resp_parse_differential
          - inline_parse
          - wal_v3_record
          - gossip_deser
          - acl_rule
          - rdb_load
          - cypher_parse
          - conf_parse
          - csr_from_bytes
          - graph_props_record
          - fts_query_parse
          - mq_wal_record
          - ws_registry_record
          - mq_registry_blob
          - redis_rdb_load
          - term_fst_sidecar
          - acl_keyspec
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Override rust-toolchain.toml for nightly
        run: rm -f rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz-nightly
      - name: Install cargo-fuzz
        # Prebuilt binary: `cargo install --locked` broke when nightly started
        # rejecting the lockfile's rustix 0.36.5 (reserved `rustc_*` attrs);
        # a binary install is immune to toolchain drift and faster.
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-fuzz
      - name: Download nightly corpus
        uses: actions/download-artifact@v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus/
        continue-on-error: true
      - name: Run fuzzer (15m, multi-process)
        # Explicit --target: the prebuilt cargo-fuzz binary is musl-linked and
        # self-detects musl as the default build target, whose std is not
        # installed (E0463 "can't find crate for `core`").
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time=900 -max_len=65536 -fork=2 -ignore_crashes=0
        env:
          MOON_NO_URING: "1"
          TARGET: ${{ matrix.target }}

  fuzz-nightly:
    if: github.event_name == 'schedule'
    name: Fuzz nightly
    runs-on: ubuntu-latest
    # GitHub hard-kills a hosted job at 6h. A 6h fuzz budget therefore consumed the
    # entire allowance, so every long-running target was cancelled mid-run (measured
    # 2026-08-14: inline_parse / resp_parse / resp_parse_differential all ended at
    # 6h 00m 17s, conclusion `cancelled`), the step never returned, and `Archive
    # corpus` never ran — discarding the accumulated corpus every night. Only targets
    # that fail fast ever reported. An explicit budget below the platform ceiling
    # leaves room for setup, build, and archiving, and makes an overrun a clean job
    # timeout rather than a silent platform cancellation.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        target:
          - resp_parse
          - resp_parse_differential
          - inline_parse
          - wal_v3_record
          - gossip_deser
          - acl_rule
          - rdb_load
          - cypher_parse
          - conf_parse
          - csr_from_bytes
          - graph_props_record
          - fts_query_parse
          - mq_wal_record
          - ws_registry_record
          - mq_registry_blob
          - redis_rdb_load
          - term_fst_sidecar
          - acl_keyspec
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Override rust-toolchain.toml for nightly
        run: rm -f rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz-nightly
      - name: Install cargo-fuzz
        # Prebuilt binary: `cargo install --locked` broke when nightly started
        # rejecting the lockfile's rustix 0.36.5 (reserved `rustc_*` attrs);
        # a binary install is immune to toolchain drift and faster.
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-fuzz
      - name: Download previous corpus
        uses: actions/download-artifact@v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus/
        continue-on-error: true
      - name: Run fuzzer (5h, multi-process)
        # Explicit --target: see fuzz-pr note (prebuilt musl cargo-fuzz).
        # 5h, not 6h: the job's 350-minute ceiling must outlast fuzzing PLUS the
        # corpus archive, or the archive is lost with the job. See timeout-minutes.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time=18000 -max_len=65536 -fork=2 -ignore_crashes=0
        env:
          MOON_NO_URING: "1"
          TARGET: ${{ matrix.target }}
      - name: Archive corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus/
          retention-days: 30
