name: CI

on:
  push:
    branches: [main]
    # Docs-only changes don't need the Rust matrix. A push/PR is skipped
    # only when EVERY changed file matches — any code file still triggers
    # the full run. CHANGELOG.md matches '**.md', but code PRs always touch
    # code too, so only genuinely docs-only PRs are skipped.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.planning/**'
      - '.add/**'
      - 'mkdocs.yml'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.planning/**'
      - '.add/**'
      - 'mkdocs.yml'
      - 'LICENSE*'
  # Manual trigger: lets the main-push-only jobs (check-macos,
  # check-windows, check-console) run against any branch before merging.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level env merges into EVERY job and a job cannot unset an inherited
# key (an empty value is still a set variable). MOON_NO_URING therefore lives
# per-job, never here — see `check-monoio`, which exists to run io_uring and was
# silently running the timer fallback for as long as this was a global.
env:
  CARGO_TERM_COLOR: always
  # 2026-07-13 CI optimization: no debuginfo in CI builds/tests — halves
  # artifact size (faster rust-cache save/restore) and speeds linking.
  # Backtraces in CI keep function names via symbol table; local builds
  # are unaffected.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  # ── Fast gate: no compilation needed (~10s) ─────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: bash scripts/audit-unsafe.sh
      - run: bash scripts/audit-unwrap.sh
      - name: CHANGELOG check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fetch labels live — the event payload snapshots labels at trigger
          # time, so a label applied after `gh pr create` is invisible to it.
          PR_LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '[.[].name] | join(",")' || echo "")
          if echo "$PR_LABELS" | grep -q 'skip-changelog'; then
            echo "skip-changelog label found — skipping"
            exit 0
          fi
          if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -q CHANGELOG.md; then
            echo "CHANGELOG.md updated"
          else
            echo "::error::CHANGELOG.md not updated. Add an entry or apply 'skip-changelog' label."
            exit 1
          fi

  # ── Main gate: clippy + test in one job, shared compilation ─────────
  # Clippy checks compile the crate; test reuses those artifacts via
  # cargo's incremental cache in the same runner. Saves ~5 min vs
  # separate jobs that each compile from scratch.
  #
  # 2026-08 CI migration: back on GitHub-hosted ubuntu. The PR path now
  # runs ZERO self-hosted jobs — `check`, `check-monoio` and
  # `client-compat` used to queue serially on the single moon-dev runner
  # (17-24m wall per PR, and every manual dispatch queued behind them).
  # The PR gate is this job + lint + msrv + memory-gate, all hosted and
  # parallel; the self-hosted legs run on main-push/dispatch and — before
  # every push — locally via `scripts/ci-local.sh` (the merge bar).
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      # tokio's io_uring bridge is off in CI (it floods errors under load).
      # Per-job, never workflow-level: `check-monoio` must not inherit it.
      MOON_NO_URING: "1"
      # Spawned test servers must not trip the diskfull write-pause on
      # runners with low free disk.
      MOON_DISK_FREE_MIN_PCT: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-tokio

      # Clippy (3 feature configurations — shares compilation between runs)
      - name: Clippy (default)
        run: cargo clippy -- -D warnings
      - name: Clippy (graph)
        run: cargo clippy --features graph -- -D warnings
      - name: Clippy (tokio)
        run: cargo clippy --no-default-features --features runtime-tokio,jemalloc -- -D warnings

      # Test — reuses .rlib artifacts from clippy's check compilation above.
      # Only the test harness + test binaries need building (incremental).
      - name: Test
        # nextest: per-test-binary parallelism + automated flake retries
        # (profile "ci" in .config/nextest.toml). Doctests are not run by
        # nextest — covered by the separate --doc step below.
        run: cargo nextest run --profile ci --no-default-features --features runtime-tokio,jemalloc
        # 30m not 15m: the step budget includes compiling all test binaries,
        # and a cold CARGO_TARGET_DIR on the self-hosted VM exceeds 15m.
        # Warm runs finish in a few minutes.
        timeout-minutes: 30
      - name: Doctests
        run: cargo test --doc --no-default-features --features runtime-tokio,jemalloc
        timeout-minutes: 5
      - name: Test (graph)
        run: "cargo nextest run --profile ci --no-default-features --features runtime-tokio,jemalloc,graph --lib -E 'test(graph::)'"
        timeout-minutes: 5

  # ── monoio — the runtime Moon actually SHIPS ────────────────────────
  # Until this job existed, every CI job that EXECUTED tests did so under
  # `--no-default-features --features runtime-tokio`. Moon's default feature
  # set is runtime-monoio, and that is what ships on Linux — so 26 monoio
  # integration test files and 30 monoio-gated src/ files were unreachable by
  # CI. That is how the v0.8.6 inline-GET ACL bypass (#457) shipped green: it
  # was wrong only on the monoio dispatch path, which no CI job could see.
  #
  # Self-hosted is not a preference: it is the only Linux runner, and therefore
  # the only place monoio's io_uring driver executes at all. MOON_NO_URING must
  # reach this job from NOWHERE — the point is io_uring. Its first cut left the
  # job block clean but inherited `MOON_NO_URING: "1"` from workflow-level env,
  # which a job cannot unset; every cooperative_yield() fell back to the
  # sleep(ZERO) timer park and `monoio_yield_overhead_is_microscopic` failed at
  # 1.45ms/yield. That var is now per-job and `ci_covers_monoio.rs` asserts both
  # scopes.
  #
  # Measured before landing (moon-dev, kernel 6.17, 2026-08-10):
  #   cargo nextest run --profile ci  ->  5145 passed, 1 flaky, 244 skipped,
  #   exit 0, 80.3s of test time. The `ci` profile's retries=2 absorbs the
  #   known load-sensitive flake class (#459) while still reporting it FLAKY,
  #   so the job is green from day one without hiding the signal.
  #
  # Guarded by tests/ci_covers_monoio.rs — weakening this job (wrong features,
  # continue-on-error, bare `cargo test`, shared target dir) fails that suite.
  #
  # 2026-08 CI migration: main-push + dispatch, no longer per-PR. The single
  # self-hosted runner serialized this job behind `check` and `client-compat`
  # on every PR. Pre-push coverage of the shipped runtime now comes from
  # `scripts/ci-local.sh` (runs this exact suite in the moon-dev VM with
  # io_uring live); this job remains the authoritative gate on every main
  # push and on `gh workflow run ci.yml --ref <branch>` before a merge.
  check-monoio:
    name: Check (monoio — the shipped runtime)
    runs-on: [self-hosted, moon-dev]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      # MUST differ from `check`'s dir: the two jobs build incompatible feature
      # sets from one checkout and can run concurrently on this runner.
      CARGO_TARGET_DIR: /home/tindang/ci-target/check-monoio
      MOON_DISK_FREE_MIN_PCT: "0"
      CARGO_BUILD_JOBS: "6"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: taiki-e/install-action@nextest

      # Default features == runtime-monoio. Never --no-default-features here.
      # `--profile ci` is load-bearing: a bare `cargo test` has no retries, and
      # an intermittently-red required job gets disabled — which is worse than
      # no job, because it still looks like coverage.
      - name: Test (default features — monoio + io_uring)
        run: cargo nextest run --profile ci
        # 30m mirrors `check`: the budget is dominated by compiling test
        # binaries on a cold CARGO_TARGET_DIR, not by the 80s of test time.
        timeout-minutes: 30

  # ── macOS — clippy + test (tokio), clippy (monoio/kqueue) ───────────
  # Main-push only (2026-07-13 queue-killer round): macOS runners are the
  # scarcest hosted pool and were the long pole on every PR. Development
  # happens on macOS locally anyway; regressions still surface on every
  # main push, and any branch can opt in via workflow_dispatch.
  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
      - name: Clippy (default monoio)
        run: cargo clippy -- -D warnings
      - name: Clippy (tokio)
        run: cargo clippy --no-default-features --features runtime-tokio,jemalloc -- -D warnings
      - name: Test (tokio)
        run: cargo nextest run --profile ci --no-default-features --features runtime-tokio,jemalloc
        # 15m was too tight: the step budget includes compilation, and a
        # cold/rebased cache spends ~11m compiling + ~8m testing (>15m),
        # tripping a wall-clock timeout with zero test failures. Match the
        # Windows Test step's 30m headroom.
        timeout-minutes: 30
      # Cross-build for Intel Mac (build only — no jemalloc: release matrix
      # ships x86_64-macos WITHOUT jemalloc to match what ships in releases.
      # console excluded here: rust_embed requires console/dist/ from `pnpm build`
      # which is not set up in check-macos; console is tested in check-console).
      - name: Add x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin
      - name: Build (x86_64-apple-darwin)
        run: cargo build --no-default-features --features runtime-tokio,graph,text-index --target x86_64-apple-darwin

  # ── Windows — main-push only (cost control) ─────────────────────────
  # Also runnable on any branch via workflow_dispatch (gh workflow run
  # ci.yml --ref <branch>) to validate Windows before merging.
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      # NASM is required by aws-lc-sys (TLS) on Windows.
      # SHA-pinned to v1.5.2 (72793074) for supply-chain safety;
      # choco fallback fires only if the action itself fails.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b  # v1.5.2
        id: nasm
        continue-on-error: true
      - name: NASM fallback (choco)
        if: steps.nasm.outcome == 'failure'
        run: choco install nasm -y
      - name: Verify cmake available
        run: cmake --version
      # No jemalloc on Windows (tikv-jemallocator does not support MSVC)
      - name: Clippy (windows)
        run: cargo clippy --no-default-features --features runtime-tokio,graph,text-index -- -D warnings
      # --no-fail-fast: cargo stops at the first failing test BINARY by default,
      # hiding failures in later binaries. This job runs at most once per main
      # push / dispatch — full visibility is worth the extra red-run minutes.
      - name: Test (windows)
        # fail-fast=false lives in .config/nextest.toml (both profiles).
        run: cargo nextest run --profile ci --no-default-features --features runtime-tokio,graph,text-index
        timeout-minutes: 30
        env:
          # windows-latest images run with <5% free on C:, permanently
          # tripping Moon's diskfull write-pause in every server-spawning
          # suite (MOONERR diskfull instead of OK). Inherited by spawned
          # moon processes; CLI --disk-free-min-pct still wins if a test
          # passes it explicitly.
          MOON_DISK_FREE_MIN_PCT: "0"

  # ── console feature — monoio+jemalloc+graph+text-index+console ───────
  # Catches the monoio+console (tokio-stream) interaction flagged as a risk.
  # pnpm build MUST run before clippy: rust_embed embeds console/dist/ at
  # compile time; without it the console feature builds but embeds nothing.
  # Main-push only — console CI is also covered by console-integration.yml
  # on PRs that touch console/ paths.
  check-console:
    name: Check (console feature)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: console
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Install console deps
        working-directory: console
        run: pnpm install --frozen-lockfile
      - name: Build console assets
        working-directory: console
        run: pnpm build
      - name: Clippy (monoio + console)
        run: cargo clippy --no-default-features --features runtime-monoio,jemalloc,graph,text-index,console -- -D warnings

  # ── MSRV — minimal build, different cache key ───────────────────────
  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo build --no-default-features --features runtime-tokio

  # ── Memory steady-state gate (~4 min) ──────────────────────────────
  # Boots Moon, loads a fixed workload, compares per-kind memory
  # against tests/fixtures/memory-baseline.json within +/-5%.
  # Self-test injects +6% to prove the gate catches regressions.
  memory-steady-state:
    name: Memory steady-state gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Spawns a real (tokio-built) moon on a GitHub-hosted runner, where
      # io_uring may be unavailable or restricted by seccomp.
      MOON_NO_URING: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: memory-gate
      - name: Install redis tools
        # Hardened after three hangs-to-timeout on hosted runners (2026-08-19):
        # force IPv4 (azure apt mirrors black-hole IPv6), bound every network
        # operation, and retry — a hung apt must fail THIS step in minutes,
        # not cancel the whole run at the workflow timeout.
        timeout-minutes: 5
        run: |
          # set +e is load-bearing: GitHub's default `shell: bash` is `bash -e`,
          # so the FIRST `apt-get` non-zero (e.g. `timeout` exit 124) aborts the
          # whole step instantly -- the retry loop below never reaches attempt 2.
          # Observed 2026-08-19: attempt-1 update timed out, step exited 124, no
          # retry. Disable -e here so a failed attempt falls through to the next.
          set +e
          # DPkg::Lock::Timeout: fresh runners often hold the dpkg frontend
          # lock via unattended-upgrades; without it apt waits FOREVER with no
          # output (observed: 5-min step timeout, zero log lines). The outer
          # `timeout` bounds each attempt against any other silent stall.
          APT_OPTS="-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60"
          for i in 1 2 3; do
            echo "apt attempt $i"
            sudo timeout 120 apt-get $APT_OPTS update -qq \
              && sudo timeout 120 apt-get $APT_OPTS install -y -qq redis-tools jq \
              && { echo "apt attempt $i ok"; exit 0; }
            echo "apt attempt $i failed; retrying" >&2
            sleep 15
          done
          exit 1
      - name: Build moon
        run: cargo build --no-default-features --features runtime-tokio,jemalloc,graph,text-index
      - name: Run memory steady-state gate (with self-test)
        run: bash scripts/bench-memory-steady-state.sh --self-test --skip-build
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memory-steady-state-report
          path: /tmp/moon-*.txt

  # ── Client compatibility — raw-RESP diff against a real redis-server ─
  # Runs on the self-hosted moon-dev VM because it already carries
  # redis-server, and because this job MUST have an oracle: the harness exits 2
  # with ERR_NO_ORACLE rather than skipping when redis-server is absent. A
  # differential harness with nothing to differ against would report a green
  # that means nothing — the exact failure class this milestone exists to close.
  #
  # The manifest ships with a recorded BASELINE of waived, reasoned divergences,
  # so this job is a ratchet: a NEW divergence fails it, and `--strict` fails
  # the moment a waived one is fixed and its waiver goes stale.
  # 2026-08 CI migration: main-push + dispatch, no longer per-PR (see
  # check-monoio's note — same single-runner serialization). Run locally
  # before push via `scripts/ci-local.sh --full` (the VM carries the same
  # redis-server oracle this job insists on).
  client-compat:
    name: Client compat (RESP2/RESP3 diff vs Redis)
    runs-on: [self-hosted, moon-dev]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      CARGO_TARGET_DIR: /home/tindang/ci-target/client-compat
      # Kept from when this was a workflow-level global, so this job's recorded
      # waiver baseline stays comparable: the differ probes RESP wire shapes,
      # which the I/O driver does not change. Drop it if the driver ever
      # becomes part of what this job is meant to prove.
      MOON_NO_URING: "1"
      MOON_DISK_FREE_MIN_PCT: "0"
      CARGO_BUILD_JOBS: "6"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Build moon (default runtime — monoio, the one clients hit)
        run: cargo build --release
        timeout-minutes: 30
      - name: Differ unit tests
        run: python3 -m unittest discover -s scripts/client-compat -p 'test_differ.py' -v
      - name: Differ end-to-end tests (real Moon + real redis-server)
        run: python3 -m unittest discover -s scripts/client-compat -p 'test_e2e.py' -v
        env:
          MOON_BIN: ${{ env.CARGO_TARGET_DIR }}/release/moon
        timeout-minutes: 15
      - name: Compatibility diff (strict — stale waivers fail)
        run: ./scripts/test-client-compat.sh --strict --record tmp/client-compat-record.json
        env:
          MOON_BIN: ${{ env.CARGO_TARGET_DIR }}/release/moon
        timeout-minutes: 15
      # A command must not change shape by context. The harness could always
      # prove this and CI never asked it to — it ran `--strict` alone, which
      # covers standalone only, while the milestone exit criterion is about all
      # three contexts. Measured before wiring: PASS=201 FAIL=0 WAIVED=17.
      - name: Compatibility diff across contexts (standalone · MULTI · pipeline)
        run: |
          ./scripts/test-client-compat.sh --strict \
            --contexts standalone,multi,pipeline \
            --record tmp/client-compat-contexts.json
        env:
          MOON_BIN: ${{ env.CARGO_TARGET_DIR }}/release/moon
        timeout-minutes: 20
      - name: INFO field coverage
        run: ./scripts/test-client-compat.sh --filter __none__ --info-manifest --record tmp/client-compat-info.json
        env:
          MOON_BIN: ${{ env.CARGO_TARGET_DIR }}/release/moon
        # HARD GATE as of EC9. Every pinned field is either emitted from a real
        # source or waived in info_fields.txt with a recorded reason, and the
        # harness refuses an unreasoned waiver (exit 2) as well as a waiver on
        # a field Moon has since started emitting — so the waiver list cannot
        # silently go stale the way the registry sweep's did.
      # ── SDK wire-form guards ────────────────────────────────────────────
      # The SDK tree had no CI of any kind, which is how five helpers shipped
      # sending wire forms the server rejects on every call. They live here
      # rather than in `check` because this is the job that already proves a
      # real client works against a real Moon, and two of the three need a
      # live server. The third guard (the command-NAME sweep,
      # tests/sdk_wire_forms.rs) is in the main test tree and already runs in
      # `check` / `check-monoio`; it spawns its own server.
      - name: Rust SDK round trip (every public helper, live)
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          "$CARGO_TARGET_DIR/release/moon" --port 6488 --shards 1 \
            --dir "$dir" --disk-free-min-pct 0 > "$dir/server.log" 2>&1 &
          pid=$!
          # Armed before the readiness wait, not after: the wait can exit
          # non-zero, and a trap installed later would leak the server.
          trap 'kill -9 $pid 2>/dev/null || true' EXIT
          # Fail loudly if it never comes up: a silently-absent server would
          # make the suite error at connect() rather than report a wire-form
          # defect, and a green-because-it-never-ran guard is worse than none.
          for _ in $(seq 1 60); do
            if redis-cli -p 6488 PING 2>/dev/null | grep -q PONG; then break; fi
            sleep 0.5
          done
          redis-cli -p 6488 PING | grep -q PONG || { cat "$dir/server.log"; exit 1; }
          MOON_TEST_URL=redis://127.0.0.1:6488 \
            cargo test --manifest-path sdk/rust/Cargo.toml --test round_trip -- --ignored
        timeout-minutes: 20
      - name: Python SDK version derivation
        # Plain `unittest`, matching the differ steps above, because the runner
        # has NO pytest and cannot get one: Ubuntu 24.04 / Python 3.14 ships
        # PEP 668 EXTERNALLY-MANAGED (so `pip install --user` aborts) and
        # `python3.14-venv` is not installed (so `python3 -m venv` fails at
        # ensurepip). Both verified on the runner rather than assumed. The
        # guard is written as `unittest.TestCase` so it needs only stdlib —
        # pytest still collects it for local development.
        #
        # Scoped to the version guards, not the whole offline suite: seven
        # tests in tests/test_text.py need pytest-asyncio and fail identically
        # on main, so gating this job on them would gate it on the runner's
        # Python environment rather than on the SDK.
        run: python3 -m unittest discover -s tests -p 'test_version.py' -v
        working-directory: sdk/python
        timeout-minutes: 10

      # ── EC2: acceptance suite driven by UNMODIFIED redis-py ──────────────
      # The raw-RESP differ above compares bytes against a real redis-server.
      # It is precise and blind to everything a client library does AROUND the
      # reply — the handshake it opens with, the connection it reuses, the
      # Python type it decodes into, the second command it issues for you. A
      # server can answer every byte correctly and still be unusable from
      # redis-py, so this drives redis-py's own idioms instead of sockets:
      # connection pools, pipeline(), pubsub(), scan_iter(), Lock, from_url.
      #
      # redis-py comes from the distro package (python3-redis 6.4.0) for the
      # same reason the version guard uses plain unittest — PEP 668 blocks pip
      # and python3.14-venv is absent. Verified on the runner.
      #
      # Runs at --shards 2 deliberately: single-shard hides the multi-shard
      # defects this suite found (#507, #508). Each is pinned inside the suite
      # so a fix breaks the run loudly instead of leaving a stale skip — which
      # is exactly what happened to #507: its pin started failing once the
      # ordering fix landed and is now a direct assertion (rp7b). #508
      # (single-key EVAL/EVALSHA rejected CROSSSLOT) is still pinned as a gap.
      - name: redis-py acceptance suite (unmodified client, live server)
        run: |
          python3 -c 'import redis; print("redis-py", redis.__version__)'
          python3 -m unittest discover \
            -s scripts/client-compat/redis_py -p 'test_acceptance.py' -v
        env:
          MOON_BIN: ${{ env.CARGO_TARGET_DIR }}/release/moon
        timeout-minutes: 15

      - name: Upload record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-compat-record
          path: tmp/client-compat-*.json
