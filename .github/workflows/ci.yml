name: CI

on:
  push:
    branches: [main]
    # Docs-only changes don't need the Rust matrix. A push/PR is skipped
    # only when EVERY changed file matches — any code file still triggers
    # the full run. CHANGELOG.md matches '**.md', but code PRs always touch
    # code too, so only genuinely docs-only PRs are skipped.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.planning/**'
      - '.add/**'
      - 'mkdocs.yml'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.planning/**'
      - '.add/**'
      - 'mkdocs.yml'
      - 'LICENSE*'
  # Manual trigger: lets the main-push-only jobs (check-macos,
  # check-windows, check-console) run against any branch before merging.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MOON_NO_URING: "1"
  # 2026-07-13 CI optimization: no debuginfo in CI builds/tests — halves
  # artifact size (faster rust-cache save/restore) and speeds linking.
  # Backtraces in CI keep function names via symbol table; local builds
  # are unaffected.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  # ── Fast gate: no compilation needed (~10s) ─────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: bash scripts/audit-unsafe.sh
      - run: bash scripts/audit-unwrap.sh
      - name: CHANGELOG check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fetch labels live — the event payload snapshots labels at trigger
          # time, so a label applied after `gh pr create` is invisible to it.
          PR_LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '[.[].name] | join(",")' || echo "")
          if echo "$PR_LABELS" | grep -q 'skip-changelog'; then
            echo "skip-changelog label found — skipping"
            exit 0
          fi
          if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -q CHANGELOG.md; then
            echo "CHANGELOG.md updated"
          else
            echo "::error::CHANGELOG.md not updated. Add an entry or apply 'skip-changelog' label."
            exit 1
          fi

  # ── Main gate: clippy + test in one job, shared compilation ─────────
  # Clippy checks compile the crate; test reuses those artifacts via
  # cargo's incremental cache in the same runner. Saves ~5 min vs
  # separate jobs that each compile from scratch.
  # Runs on the self-hosted moon-dev runner (OrbStack VM, aarch64 Linux):
  # zero queue time vs the org-wide hosted-runner concurrency cap, and a
  # persistent CARGO_TARGET_DIR outside the runner workspace (checkout's
  # git clean can't wipe it) makes warm builds incremental — no cache
  # download/upload at all. Fork-PR safety: repo requires manual approval
  # for ALL outside-collaborator workflow runs. If the runner is offline
  # the job queues — bring the VM up or retag runs-on to ubuntu-latest.
  check:
    name: Check
    runs-on: [self-hosted, moon-dev]
    env:
      CARGO_TARGET_DIR: /home/tindang/ci-target/check
      # Spawned test servers must not trip the diskfull write-pause on the
      # VM's shared-volume mounts.
      MOON_DISK_FREE_MIN_PCT: "0"
      # Cap rustc parallelism: the first run OOM-killed the runner service
      # (kernel oom-kill at 3G peak + 2.5G swap) when -j<cores> rustc
      # processes ran concurrently in the VM. VM memory is 12G now, but
      # keep headroom for nextest's spawned test servers.
      CARGO_BUILD_JOBS: "6"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest

      # Clippy (3 feature configurations — shares compilation between runs)
      - name: Clippy (default)
        run: cargo clippy -- -D warnings
      - name: Clippy (graph)
        run: cargo clippy --features graph -- -D warnings
      - name: Clippy (tokio)
        run: cargo clippy --no-default-features --features runtime-tokio,jemalloc -- -D warnings

      # Test — reuses .rlib artifacts from clippy's check compilation above.
      # Only the test harness + test binaries need building (incremental).
      - name: Test
        # nextest: per-test-binary parallelism + automated flake retries
        # (profile "ci" in .config/nextest.toml). Doctests are not run by
        # nextest — covered by the separate --doc step below.
        run: cargo nextest run --profile ci --no-default-features --features runtime-tokio,jemalloc
        # 30m not 15m: the step budget includes compiling all test binaries,
        # and a cold CARGO_TARGET_DIR on the self-hosted VM exceeds 15m.
        # Warm runs finish in a few minutes.
        timeout-minutes: 30
      - name: Doctests
        run: cargo test --doc --no-default-features --features runtime-tokio,jemalloc
        timeout-minutes: 5
      - name: Test (graph)
        run: "cargo nextest run --profile ci --no-default-features --features runtime-tokio,jemalloc,graph --lib -E 'test(graph::)'"
        timeout-minutes: 5

  # ── macOS — clippy + test (tokio), clippy (monoio/kqueue) ───────────
  # Main-push only (2026-07-13 queue-killer round): macOS runners are the
  # scarcest hosted pool and were the long pole on every PR. Development
  # happens on macOS locally anyway; regressions still surface on every
  # main push, and any branch can opt in via workflow_dispatch.
  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
      - name: Clippy (default monoio)
        run: cargo clippy -- -D warnings
      - name: Clippy (tokio)
        run: cargo clippy --no-default-features --features runtime-tokio,jemalloc -- -D warnings
      - name: Test (tokio)
        run: cargo nextest run --profile ci --no-default-features --features runtime-tokio,jemalloc
        # 15m was too tight: the step budget includes compilation, and a
        # cold/rebased cache spends ~11m compiling + ~8m testing (>15m),
        # tripping a wall-clock timeout with zero test failures. Match the
        # Windows Test step's 30m headroom.
        timeout-minutes: 30
      # Cross-build for Intel Mac (build only — no jemalloc: release matrix
      # ships x86_64-macos WITHOUT jemalloc to match what ships in releases.
      # console excluded here: rust_embed requires console/dist/ from `pnpm build`
      # which is not set up in check-macos; console is tested in check-console).
      - name: Add x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin
      - name: Build (x86_64-apple-darwin)
        run: cargo build --no-default-features --features runtime-tokio,graph,text-index --target x86_64-apple-darwin

  # ── Windows — main-push only (cost control) ─────────────────────────
  # Also runnable on any branch via workflow_dispatch (gh workflow run
  # ci.yml --ref <branch>) to validate Windows before merging.
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      # NASM is required by aws-lc-sys (TLS) on Windows.
      # SHA-pinned to v1.5.2 (72793074) for supply-chain safety;
      # choco fallback fires only if the action itself fails.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b  # v1.5.2
        id: nasm
        continue-on-error: true
      - name: NASM fallback (choco)
        if: steps.nasm.outcome == 'failure'
        run: choco install nasm -y
      - name: Verify cmake available
        run: cmake --version
      # No jemalloc on Windows (tikv-jemallocator does not support MSVC)
      - name: Clippy (windows)
        run: cargo clippy --no-default-features --features runtime-tokio,graph,text-index -- -D warnings
      # --no-fail-fast: cargo stops at the first failing test BINARY by default,
      # hiding failures in later binaries. This job runs at most once per main
      # push / dispatch — full visibility is worth the extra red-run minutes.
      - name: Test (windows)
        # fail-fast=false lives in .config/nextest.toml (both profiles).
        run: cargo nextest run --profile ci --no-default-features --features runtime-tokio,graph,text-index
        timeout-minutes: 30
        env:
          # windows-latest images run with <5% free on C:, permanently
          # tripping Moon's diskfull write-pause in every server-spawning
          # suite (MOONERR diskfull instead of OK). Inherited by spawned
          # moon processes; CLI --disk-free-min-pct still wins if a test
          # passes it explicitly.
          MOON_DISK_FREE_MIN_PCT: "0"

  # ── console feature — monoio+jemalloc+graph+text-index+console ───────
  # Catches the monoio+console (tokio-stream) interaction flagged as a risk.
  # pnpm build MUST run before clippy: rust_embed embeds console/dist/ at
  # compile time; without it the console feature builds but embeds nothing.
  # Main-push only — console CI is also covered by console-integration.yml
  # on PRs that touch console/ paths.
  check-console:
    name: Check (console feature)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: console
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Install console deps
        working-directory: console
        run: pnpm install --frozen-lockfile
      - name: Build console assets
        working-directory: console
        run: pnpm build
      - name: Clippy (monoio + console)
        run: cargo clippy --no-default-features --features runtime-monoio,jemalloc,graph,text-index,console -- -D warnings

  # ── MSRV — minimal build, different cache key ───────────────────────
  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo build --no-default-features --features runtime-tokio

  # ── Memory steady-state gate (~4 min) ──────────────────────────────
  # Boots Moon, loads a fixed workload, compares per-kind memory
  # against tests/fixtures/memory-baseline.json within +/-5%.
  # Self-test injects +6% to prove the gate catches regressions.
  memory-steady-state:
    name: Memory steady-state gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: memory-gate
      - name: Install redis tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools jq
      - name: Build moon
        run: cargo build --no-default-features --features runtime-tokio,jemalloc,graph,text-index
      - name: Run memory steady-state gate (with self-test)
        run: bash scripts/bench-memory-steady-state.sh --self-test --skip-build
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memory-steady-state-report
          path: /tmp/moon-*.txt
