name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MOON_NO_URING: "1"

jobs:
  durability:
    name: Durability Tests
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Build Moon (release)
        run: cargo build --release --no-default-features --features runtime-tokio,jemalloc
      - name: Run crash matrix tests
        run: cargo test --release --no-default-features --features runtime-tokio,jemalloc --test durability_tests
        timeout-minutes: 10
      # moon#1285: TXN.ABORT must survive kill -9 (tokio leg: KV + vector;
      # graph and the replica leg skip themselves without the `graph` feature).
      - name: Run TXN.ABORT durability tests
        run: >-
          MOON_BIN=target/release/moon
          cargo test --release --no-default-features --features runtime-tokio,jemalloc
          --test txn_abort_durability_1285 -- --ignored --test-threads=1
        timeout-minutes: 10
      # moon#1294 / moon#1288 / moon#1290: the real-server guards the wave-1
      # review found in no gate (MINOR 2) plus its routed-EVAL finding (F2):
      # one reason-DEL backpressure bound per eviction run against a stalled
      # AOF, the adaptive expired-backlog drain, and a script routed to
      # another shard (--shards 4) tiering its no-AOF eviction victims
      # instead of dropping them.
      - name: Run eviction / active-expiry / routed-script tiering guards
        run: >-
          MOON_BIN=target/release/moon
          cargo test --release --no-default-features --features runtime-tokio,jemalloc
          --test eviction_reason_del_run_budget_1294 --test active_expiry_backlog_drain_1288
          --test review_w1_routed_eval_tiering_1290 -- --include-ignored --test-threads=1
        timeout-minutes: 8
      - name: Run jepsen-lite tests
        run: cargo test --release --no-default-features --features runtime-tokio,jemalloc --test jepsen_lite
        timeout-minutes: 10

  crash-matrix-per-shard:
    name: Crash Matrix (per-shard AOF)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-latest
    # 15 -> 20: the eviction / expiry / routed-script guards (~2 min) joined.
    timeout-minutes: 20
    # MOON_NO_URING is already set globally at the workflow level (line 16).
    # No job-level env override needed — monoio falls back to epoll automatically.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-${{ hashFiles('Cargo.lock') }}
      - name: Install redis-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools
      - name: Build Moon (release, monoio default)
        run: cargo build --release
      - name: Run per-shard AOF crash matrix
        run: cargo test --release --test crash_matrix_per_shard_aof -- --ignored
        timeout-minutes: 10
      # moon#1285: TXN.ABORT must survive kill -9 and reach a replica
      # (monoio: every plane, --shards 1 and 4, plus the replica leg).
      - name: Run TXN.ABORT durability tests
        run: >-
          MOON_BIN=target/release/moon
          cargo test --release --test txn_abort_durability_1285 -- --ignored --test-threads=1
        timeout-minutes: 10
      # moon#1294 / moon#1288 / moon#1290: the same guards as the durability
      # job's tokio leg, on the runtime that ships.
      - name: Run eviction / active-expiry / routed-script tiering guards
        run: >-
          MOON_BIN=target/release/moon
          cargo test --release
          --test eviction_reason_del_run_budget_1294 --test active_expiry_backlog_drain_1288
          --test review_w1_routed_eval_tiering_1290 -- --include-ignored --test-threads=1
        timeout-minutes: 8

  replication:
    name: Replication Tests
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Build Moon (release)
        run: cargo build --release --no-default-features --features runtime-tokio,jemalloc
      - name: Run replication hardening tests
        run: cargo test --release --no-default-features --features runtime-tokio,jemalloc --test replication_hardening
        timeout-minutes: 10
