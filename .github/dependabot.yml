version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    groups:
      async-runtime:
        patterns: ["tokio*", "monoio*", "futures*"]
      crypto-tls:
        patterns: ["rustls*", "aws-lc-rs*"]
      tracing:
        patterns: ["tracing*"]
      # Catch-all for every other patch/minor bump: one Monday PR instead
      # of up to five. Six near-simultaneous dependabot CI runs starved the
      # single self-hosted runner for >20 min on 2026-07-15 (a human PR sat
      # QUEUED behind the batch). Major bumps still get individual PRs —
      # they need individual review anyway.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # mlua vendored — major bumps need manual testing of Lua sandbox
      - dependency-name: mlua
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 3
    ignore:
      # The rust-toolchain action pin IS the MSRV (1.94) check — bumping it
      # to the latest stable defeats the MSRV gate. Bump only when the MSRV
      # policy itself changes (see CLAUDE.md).
      - dependency-name: dtolnay/rust-toolchain
