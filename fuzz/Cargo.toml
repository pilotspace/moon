[package]
name = "moon-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"

[dependencies.moon]
path = ".."
default-features = false
features = ["runtime-tokio", "jemalloc", "graph", "text-index", "fuzzing"]

[dependencies.tempfile]
version = "3"

# --- Fuzz targets ---

[[bin]]
name = "resp_parse"
path = "fuzz_targets/resp_parse.rs"
doc = false

[[bin]]
name = "resp_parse_differential"
path = "fuzz_targets/resp_parse_differential.rs"
doc = false

[[bin]]
name = "inline_parse"
path = "fuzz_targets/inline_parse.rs"
doc = false

[[bin]]
name = "wal_v3_record"
path = "fuzz_targets/wal_v3_record.rs"
doc = false

[[bin]]
name = "rdb_load"
path = "fuzz_targets/rdb_load.rs"
doc = false

[[bin]]
name = "gossip_deser"
path = "fuzz_targets/gossip_deser.rs"
doc = false

[[bin]]
name = "acl_rule"
path = "fuzz_targets/acl_rule.rs"
doc = false

[[bin]]
name = "cypher_parse"
path = "fuzz_targets/cypher_parse.rs"
doc = false

[[bin]]
name = "conf_parse"
path = "fuzz_targets/conf_parse.rs"
doc = false

[[bin]]
name = "csr_from_bytes"
path = "fuzz_targets/csr_from_bytes.rs"
doc = false

[[bin]]
name = "fts_query_parse"
path = "fuzz_targets/fts_query_parse.rs"
doc = false

[workspace]
members = ["."]

[[bin]]
name = "graph_props_record"
path = "fuzz_targets/graph_props_record.rs"
doc = false

[[bin]]
name = "mq_wal_record"
path = "fuzz_targets/mq_wal_record.rs"
doc = false

[[bin]]
name = "ws_registry_record"
path = "fuzz_targets/ws_registry_record.rs"
doc = false

[[bin]]
name = "mq_registry_blob"
path = "fuzz_targets/mq_registry_blob.rs"
doc = false

[[bin]]
name = "redis_rdb_load"
path = "fuzz_targets/redis_rdb_load.rs"
doc = false

[[bin]]
name = "term_fst_sidecar"
path = "fuzz_targets/term_fst_sidecar.rs"
doc = false

