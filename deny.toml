# cargo-deny configuration for Moon (v2 format).
# Run: cargo deny check advisories licenses bans sources
#
# CI: wired into .github/workflows/supply-chain.yml (job `deny`), which runs
# `cargo deny check advisories licenses bans sources` on every PR touching
# Cargo.toml/Cargo.lock/deny.toml, on push to main, and weekly. Companion
# job `audit` runs `cargo audit` against the same lockfile. Both are
# blocking (SUPPLY-01).
#
# advisories `ignore` entries below: cargo-deny 2.x has no separate
# severity knob for vulnerability/unmaintained/unsound/notice — every
# matched advisory is a hard error unless explicitly ignored here. Real
# vulnerabilities get fixed in the lockfile (see git log for `cargo update`
# commits); only advisories with genuinely no available upgrade are
# ignored, each with a reason and a re-check-by note.

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # fxhash 0.2.1 (transitive via monoio 0.2.4 -> monoio-io-wrapper /
    # monoio-rustls): unmaintained, no safe upgrade published upstream.
    # monoio owns the fxhash pin; revisit when monoio bumps past it.
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained with no safe replacement; pinned transitively by monoio 0.2.4 (vendor/monoio) — revisit when monoio drops it" },
    # paste 1.0.15 (transitive via tikv-jemalloc-ctl 0.6.1): unmaintained,
    # archived by upstream, no safe upgrade (the suggested forks — pastey /
    # with_builtin_macros — are not drop-in without a tikv-jemalloc-ctl bump).
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained (archived upstream) with no safe upgrade; pinned transitively by tikv-jemalloc-ctl 0.6.1 — revisit on next jemalloc-ctl major bump" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
