# cargo-deny configuration for Moon (v2 format).
# Run: cargo deny check
#
# CI: this config is NOT currently wired into any GitHub Actions job — run
# it locally / ad hoc. The "Lint" job in .github/workflows/ci.yml runs
# scripts/audit-unsafe.sh + scripts/audit-unwrap.sh (SAFETY-comment coverage
# and an unwrap ratchet), which is a different check and does not invoke
# `cargo deny` or `cargo audit`.
# TODO(ci): wire `cargo deny check` into a blocking CI job (tracked
# separately — not part of this change).

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
