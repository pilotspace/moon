# Client-compat manifest — Moon vs a real redis-server.
#
# Breadth strategy (frozen at the contract): HARD CASES FIRST. The first block
# targets the replies most likely to falsify the five-policy normalization model
# — if the model is wrong, it must break here, before breadth is added on top of
# it. The rest reproduces the defects the 2026-08 client/SDK deep review found,
# so each wave-2 task has a wire-level reproduction to work against.
#
# policy: exact | sorted | type_only | numeric_tolerance | ignore_value
#
# expect_diff.reason is REQUIRED whenever expect_diff is present — an
# unexplained waiver is exactly the silent pass this harness exists to prevent.
# The waivers below are the BASELINE recorded on the harness's first full run
# (2026-08-09, oracle redis 8.6.1, moon 0.8.5+): every one is a real, reproduced
# divergence owned by a named wave-2 task. They make CI a ratchet — a NEW
# divergence fails the job, and `--strict` fails the moment a waived one is
# fixed, so a waiver cannot rot into a permanent blind spot.

entries:

  # ── Hard cases: legitimate non-determinism ────────────────────────────
  # These exist to falsify the policy model. Where they carry a waiver it is
  # for a REAL type divergence, never because normalization fell short.

  - name: hard_ttl_drift
    setup: ["SET k v", "EXPIRE k 100"]
    command: "TTL k"
    policy: numeric_tolerance
    tolerance: 5

  - name: hard_pttl_drift
    setup: ["SET k v", "PEXPIRE k 100000"]
    command: "PTTL k"
    policy: numeric_tolerance
    tolerance: 5000

  - name: hard_scan_cursor
    setup: ["MSET a 1 b 2 c 3"]
    command: "SCAN 0"
    policy: type_only

  - name: hard_randomkey
    setup: ["MSET a 1 b 2 c 3"]
    command: "RANDOMKEY"
    policy: type_only

  - name: hard_srandmember
    setup: ["DEL s", "SADD s a b c"]
    command: "SRANDMEMBER s"
    policy: type_only

  - name: hard_unordered_smembers
    setup: ["DEL s", "SADD s a b c"]
    command: "SMEMBERS s"
    policy: sorted

  - name: hard_unordered_hgetall
    setup: ["DEL h", "HSET h f1 v1 f2 v2"]
    command: "HGETALL h"
    policy: sorted

  - name: hard_float_formatting
    setup: ["SET f 10.5"]
    command: "INCRBYFLOAT f 0.1"
    policy: numeric_tolerance
    tolerance: 0.0001

  - name: hard_zscore_float
    setup: ["DEL z", "ZADD z 1.5 a"]
    command: "ZSCORE z a"
    policy: numeric_tolerance
    tolerance: 0.0001

  # ── Transaction integrity ─────────────────────────────────────────────

  # Found by this harness 2026-08-09 and FIXED in the same v0.8.6 hotfix
  # (PR #457): GET inside MULTI was answered by the inline fast path instead of
  # queued, so EXEC returned *0. The waiver that recorded it went stale the
  # moment the fix landed and --strict said so by name — which is the whole
  # point of the mechanism. Kept unwaived as the permanent regression guard.
  - name: multi_get_must_queue
    setup: ["SET k v"]
    command: "GET k"
    policy: exact

  - name: multi_queues_config_get
    command: "CONFIG GET maxmemory"
    policy: type_only
    expect_diff:
      reason: >-
        FOUND BY THIS HARNESS, 2026-08-09. CONFIG GET inside MULTI is not
        queued either — EXEC returns *0. A second command family bypassing
        transaction queueing, distinct from the inline-GET path.
        Owner: multi-exec-queue-semantics (re-owned 2026-08-10: a
        transaction-QUEUEING defect, not a reply-type one).
        STILL REPRODUCES 2026-08-12 after the MULTI queue gate landed, which
        DID fix the same class for INFO and SUBSCRIBE. CONFIG sits below the
        gate in every handler, so the reason is not intercept order and is not
        yet understood — deliberately not guessed at here.

  # FIXED 2026-08-12 by multi-exec-queue-semantics. The waivers are retired
  # rather than deleted: these two are now live parity assertions, so the
  # EXECABORT behaviour cannot silently regress. Moon used to queue the bad
  # command and surface its -ERR from inside EXEC, leaving the transaction
  # PARTIALLY APPLIED — `MULTI / NOSUCHCMD / SET k v / EXEC` left k set.
  - name: multi_aborts_on_unknown_command
    command: "THISCOMMANDDOESNOTEXIST"
    policy: exact

  - name: multi_aborts_on_wrong_arity
    command: "GET"
    policy: exact

  # ── RESP3 reply-type fidelity (review findings, wire-confirmed) ───────

  - name: type_sismember_is_integer
    setup: ["DEL s", "SADD s a"]
    command: "SISMEMBER s a"
    policy: exact

  - name: type_expire_is_integer
    setup: ["SET k v"]
    command: "EXPIRE k 100"
    policy: exact

  - name: type_incrbyfloat_is_bulk
    setup: ["SET f 1"]
    command: "INCRBYFLOAT f 1"
    policy: type_only

  - name: shape_hrandfield_withvalues_is_pair_array
    setup: ["DEL h", "HSET h f1 v1"]
    command: "HRANDFIELD h 1 WITHVALUES"
    policy: sorted

  - name: shape_zrandmember_withscores_is_pair_array
    setup: ["DEL z", "ZADD z 1 a"]
    command: "ZRANDMEMBER z 1 WITHSCORES"
    policy: sorted

  - name: shape_zrange_withscores
    setup: ["DEL z", "ZADD z 1 a 2 b"]
    command: "ZRANGE z 0 -1 WITHSCORES"
    policy: exact

  - name: shape_zpopmin
    setup: ["DEL z", "ZADD z 1 a 2 b"]
    command: "ZPOPMIN z"
    policy: exact

  # moon#559: the KEYED pops. `ZPOPMIN z` was probed here from the start and
  # was correct; its blocking cousin was not, because the reply prefixes the
  # key and so needs its own shape rule. Both protocols, because the fix is
  # RESP3-only and RESP2 must not move.
  - name: shape_bzpopmin_score_is_double
    setup: ["DEL z", "ZADD z 1.5 a"]
    command: "BZPOPMIN z 0"
    policy: exact

  - name: shape_bzpopmax_score_is_double
    setup: ["DEL z", "ZADD z 1.5 a"]
    command: "BZPOPMAX z 0"
    policy: exact

  - name: shape_zmpop_score_is_double
    setup: ["DEL z", "ZADD z 1.5 a"]
    command: "ZMPOP 1 z MIN"
    policy: exact

  - name: shape_bzmpop_score_is_double
    setup: ["DEL z", "ZADD z 1.5 a"]
    command: "BZMPOP 0 1 z MIN"
    policy: exact

  # The same sweep found ZREVRANGE carrying arity 4 where Redis has -4, which
  # only the MULTI queue gate consumes — standalone it always worked, so this
  # probe pins the reply that the in-MULTI leg of the harness exercises.
  - name: shape_zrevrange_withscores
    setup: ["DEL z", "ZADD z 1 a 2 b"]
    command: "ZREVRANGE z 0 -1 WITHSCORES"
    policy: exact

  - name: shape_spop_with_count_is_set
    setup: ["DEL s", "SADD s a b c"]
    command: "SPOP s 2"
    policy: type_only

  - name: shape_xinfo_stream
    setup: ["DEL st", "XADD st '*' f v"]
    command: "XINFO STREAM st"
    policy: type_only
    expect_diff:
      reason: >-
        NARROWED 2026-08-10 by resp3-type-fidelity: the reply TYPE is now
        correct — both servers answer a Map. What remains is a FIELD-SET gap,
        not a reply-shape gap: Moon reports 7 fields, Redis 8.6.1 reports 16.
        Each missing field (entries-added, max-deleted-entry-id,
        recorded-first-entry-id, and the 8.x idempotency counters
        idmp-*/pids-tracked/iids-*) needs real stream bookkeeping, and
        inventing values would serve a client worse than their absence.
        Owner: resp3-type-fidelity, carried forward as a SPEC delta —
        stream-metadata completeness, NOT a RESP3 conversion defect.

  - name: config_get_resp3_is_a_map
    command: "CONFIG GET maxmemory"
    policy: type_only
    protocols: [resp3]
    contexts: [standalone, pipeline]

  # ── Miss path: emptiness must not change the reply TYPE ───────────────
  # Every case above populates its key first, so the harness only ever diffed
  # the hit path — which is how an empty HGETALL answering *0 instead of %0
  # survived a 128-PASS run. The miss path is the one clients hit most and
  # tested least; these cases keep it diffed against the live oracle.

  - name: empty_hgetall_is_still_a_map
    setup: ["DEL nosuchhash"]
    command: "HGETALL nosuchhash"
    policy: type_only

  - name: empty_config_get_is_still_a_map
    command: "CONFIG GET no-such-parameter-at-all"
    policy: type_only
    contexts: [standalone, pipeline]

  # Split from the entry above rather than folded into it: a waiver is
  # per-entry, so waiving the whole case would blunt the two contexts that
  # genuinely pass. This entry keeps the MULTI defect on the books.
  - name: empty_config_get_in_multi
    command: "CONFIG GET no-such-parameter-at-all"
    policy: type_only
    contexts: [multi]
    expect_diff:
      reason: >-
        Redis answers *1[%0]; Moon answers a bare *0 — CONFIG GET is never
        queued inside MULTI at all, so EXEC returns an empty array. The reply
        TYPE is correct in every context where the command actually runs
        (standalone and pipeline both answer %0); this is the transaction
        QUEUEING gap, not a reply-shape one.
        STILL REPRODUCES 2026-08-12 after the MULTI queue gate landed — see
        multi_queues_config_get for the same unexplained residual.
        Owner: multi-exec-queue-semantics.

  - name: empty_smembers_is_still_a_set
    setup: ["DEL nosuchset"]
    command: "SMEMBERS nosuchset"
    policy: type_only

  - name: empty_zrange_withscores_stays_an_array
    setup: ["DEL nosuchzset"]
    command: "ZRANGE nosuchzset 0 -1 WITHSCORES"
    policy: type_only

  - name: empty_hrandfield_withvalues_stays_an_array
    setup: ["DEL nosuchhash2"]
    command: "HRANDFIELD nosuchhash2 2 WITHVALUES"
    policy: type_only

  # ── Identity & introspection (review findings, wire-confirmed) ────────

  # Waivers removed with client-identity-introspection: COMMAND COUNT answered
  # an empty Array *0 (ignoring the subcommand and falling through to the bare
  # COMMAND stub) and ROLE was -ERR unknown command. Both are live comparisons
  # now. `type_only` is the right policy for the pair: the COUNT values are
  # SUPPOSED to differ (Moon implements a different number of commands than
  # Redis), and ROLE's offset moves — what must match is the reply TYPE, which
  # is what clients dispatch on.
  - name: identity_command_count
    command: "COMMAND COUNT"
    policy: type_only

  - name: identity_role
    command: "ROLE"
    policy: type_only

  - name: identity_command_info_known_and_unknown
    command: "COMMAND INFO GET nosuchcmd"
    policy: type_only
    expect_diff:
      reason: >-
        The 10-field spec SHAPE now matches (that was the fix), and the unknown
        name correctly yields a Null element. Three inner divergences remain,
        all pre-existing data/typing gaps rather than introspection bugs:
        (1) acl_categories is thin — Redis reports @read @string @fast for GET,
        Moon's registry carries only @string;
        (2) key_specs is empty — Redis emits one spec for GET, Moon emits *0;
        (3) under RESP3 Redis types flags and acl_categories as Sets (~) and
        key_specs entries as Maps (%), while Moon emits Arrays (*).
        A client dispatching on the reply shape is served; one reading
        acl_categories to build a permission model is not.
        Owner: (1)+(2) sdk-wire-form-fixes, (3) resp3-type-fidelity.

  - name: identity_command_getkeys
    command: "COMMAND GETKEYS MSET k1 v1 k2 v2"
    policy: exact

  - name: identity_reset
    command: "RESET"
    policy: exact

  # ── Error-code parity (compared on the code, never the message) ───────

  # Waiver removed with the MULTI queueing fix: the MULTI legs used to diverge
  # only because the inline GET ran instead of queueing, emptying EXEC.
  - name: error_wrongtype
    setup: ["DEL k", "LPUSH k v"]
    command: "GET k"
    policy: exact

  # ── Pub/sub: RESP3 framing and the subscriber-mode allow-list ─────────
  #
  # The oracle keeps these honest because both are things a unit test can
  # assert against Moon's own idea of correct and still be wrong. The
  # confirmation FRAME TYPE in particular: Moon's deliveries were already
  # Push while its confirmations were Arrays, and only a byte-level
  # comparison against a real server shows that.

  - name: pubsub_subscribe_confirmation_framing
    command: "SUBSCRIBE compat_ch"
    policy: exact
    contexts: [standalone]

  - name: pubsub_psubscribe_confirmation_framing
    command: "PSUBSCRIBE compat_p.*"
    policy: exact
    contexts: [standalone]

  - name: pubsub_unsubscribe_from_nothing_names_null_channel
    command: "UNSUBSCRIBE"
    policy: exact
    contexts: [standalone]

  - name: pubsub_numpat_counts_distinct_patterns
    command: "PUBSUB NUMPAT"
    policy: exact
    contexts: [standalone]

  - name: pubsub_shardchannels_is_a_separate_namespace
    command: "PUBSUB SHARDCHANNELS"
    policy: exact
    contexts: [standalone]

  - name: pubsub_ssubscribe_confirmation_framing
    command: "SSUBSCRIBE compat_sch"
    policy: exact
    contexts: [standalone]

  - name: pubsub_spublish_to_nobody
    command: "SPUBLISH compat_sch hello"
    policy: exact
    contexts: [standalone]

  # MONITOR: the attach reply and the registry entry. The FEED itself is a
  # stream, not a reply, so it cannot be diffed by a request/response harness —
  # tests/monitor_command_feed.rs owns the line-format parity, byte for byte.
  - name: monitor_command_is_registered
    command: "COMMAND INFO monitor"
    policy: exact
    contexts: [standalone]
    expect_diff:
      reason: >-
        The 10-field spec shape, arity 1 and the four flags (admin, noscript,
        loading, stale) all match. One inner divergence remains: Redis reports
        acl_categories @admin @slow @dangerous, Moon reports @dangerous @slow —
        Moon's registry has no @admin CATEGORY at all (its AclCategories table
        renders SERVER as @server and has no admin bit), so the name cannot be
        emitted without adding a category to the registry-wide table. This is the
        same acl_categories thinness already waived for
        identity_command_info_known_and_unknown, not a MONITOR-specific gap, and
        it is not a permission hole: `+@all -@admin` DOES refuse MONITOR, because
        Moon resolves @admin from a command-name list in src/acl/rules.rs rather
        than from the category bitmask (pinned by mon14_non_admin_cannot_attach).
        Owner: sdk-wire-form-fixes, which owns acl_categories completeness.

  - name: monitor_rejects_arguments
    command: "MONITOR extra"
    policy: exact
    contexts: [standalone]

  # ── Redis-parity batch: #527 / #526 / #520 / #521 ─────────────────────
  #
  # Four command-level divergences found by diffing Moon against a live
  # redis-server 8.6.1. Each is pinned here as well as in a unit test, because
  # a unit test can only assert Moon against Moon's own idea of correct — and
  # three of these four were cases where that idea was wrong.
  #
  # Restricted to standalone + pipeline: the MULTI leg has its own known
  # queueing gaps (see empty_config_get_in_multi) and would waive these for a
  # reason that has nothing to do with the commands under test.

  # #520 — RPOPLPUSH had no dispatch arm at all ("unknown command"), while
  # LMOVE and BRPOPLPUSH both worked. Diff the reply AND both keys after it: a
  # stub that returned the tail without moving it passes a reply-only check.
  - name: parity_rpoplpush_moves_the_tail
    setup: ["DEL cl:rl", "DEL cl:rl-d", "RPUSH cl:rl a b c"]
    command: "RPOPLPUSH cl:rl cl:rl-d"
    policy: exact
    contexts: [standalone, pipeline]

  - name: parity_rpoplpush_leaves_the_source_short
    setup: ["DEL cl:rl2", "DEL cl:rl2-d", "RPUSH cl:rl2 a b c", "RPOPLPUSH cl:rl2 cl:rl2-d"]
    command: "LRANGE cl:rl2 0 -1"
    policy: exact
    contexts: [standalone, pipeline]

  - name: parity_rpoplpush_pushes_to_the_destination_head
    setup: ["DEL cl:rl3", "DEL cl:rl3-d", "RPUSH cl:rl3 a b c", "RPUSH cl:rl3-d z", "RPOPLPUSH cl:rl3 cl:rl3-d"]
    command: "LRANGE cl:rl3-d 0 -1"
    policy: exact
    contexts: [standalone, pipeline]

  - name: parity_rpoplpush_absent_source_is_null_bulk
    setup: ["DEL cl:rl-none", "DEL cl:rl-none-d"]
    command: "RPOPLPUSH cl:rl-none cl:rl-none-d"
    policy: exact
    contexts: [standalone, pipeline]

  # #527 — the count was validated AFTER the key lookup, so a malformed count
  # against an absent key answered `*-1` instead of an error. The differ
  # compares error CODES, not messages, so what this catches is precisely the
  # reply KIND flip (error vs null array) that the defect produced.
  - name: parity_lpop_bad_count_on_absent_key_is_an_error
    setup: ["DEL cl:lp-none"]
    command: "LPOP cl:lp-none abc"
    policy: exact
    contexts: [standalone, pipeline]

  - name: parity_lpop_negative_count_on_absent_key_is_an_error
    setup: ["DEL cl:lp-none2"]
    command: "LPOP cl:lp-none2 -1"
    policy: exact
    contexts: [standalone, pipeline]

  # The fence: a WELL-FORMED count on an absent key is still the null array.
  - name: parity_lpop_good_count_on_absent_key_is_null_array
    setup: ["DEL cl:lp-none3"]
    command: "LPOP cl:lp-none3 2"
    policy: exact
    contexts: [standalone, pipeline]

  # #526 — history mode (an explicit ID) always names the stream, even when the
  # consumer's PEL slice is empty; Moon answered a null. Scoped to RESP2: the
  # #526 fix is the null→stream-name change, which is clean under RESP2's
  # unambiguous array container. Under RESP3 Redis wraps the whole XREAD/
  # XREADGROUP reply in a Map (stream-name => entries) while Moon still emits an
  # Array — a pre-existing systemic gap, orthogonal to #526, guarded separately
  # just below.
  - name: parity_xreadgroup_history_empty_pel_names_the_stream
    setup: ["DEL cl:xrg", "XGROUP CREATE cl:xrg g $ MKSTREAM"]
    command: "XREADGROUP GROUP g c COUNT 10 STREAMS cl:xrg 0"
    policy: exact
    protocols: [resp2]
    contexts: [standalone, pipeline]

  # The RESP3 container gap the #526 probe surfaced: Redis 7+ types a non-empty
  # XREADGROUP reply as a Map keyed by stream name, and Moon used to emit the
  # RESP2 Array in every protocol. FIXED in moon#577 (Resp3Shape::StreamMap) —
  # the waiver is removed, so the probe now compares exact bytes against the
  # oracle and a regression fails the harness rather than being tolerated.
  - name: parity_xreadgroup_history_resp3_reply_is_map
    setup: ["DEL cl:xrg3", "XGROUP CREATE cl:xrg3 g $ MKSTREAM"]
    command: "XREADGROUP GROUP g c COUNT 10 STREAMS cl:xrg3 0"
    policy: exact
    protocols: [resp3]
    contexts: [standalone, pipeline]

  # The fence: the `>` form with nothing new stays the null array.
  - name: parity_xreadgroup_new_only_miss_is_null_array
    setup: ["DEL cl:xrg2", "XGROUP CREATE cl:xrg2 g $ MKSTREAM"]
    command: "XREADGROUP GROUP g c COUNT 10 STREAMS cl:xrg2 >"
    policy: exact
    contexts: [standalone, pipeline]
  # #521 — ZRANK/ZREVRANK WITHSCORE (Redis 7.2) were an arity error. The miss
  # is a null ARRAY here, unlike the plain form's null bulk, so the option
  # changes the null type as well as the hit type.
  - name: parity_zrank_withscore_hit
    setup: ["DEL cl:zr", "ZADD cl:zr 1 m 2 n"]
    command: "ZRANK cl:zr n WITHSCORE"
    policy: exact
    contexts: [standalone, pipeline]

  - name: parity_zrevrank_withscore_hit
    setup: ["DEL cl:zr2", "ZADD cl:zr2 1 m 2 n"]
    command: "ZREVRANK cl:zr2 n WITHSCORE"
    policy: exact
    contexts: [standalone, pipeline]

  - name: parity_zrank_withscore_absent_key_is_null_array
    setup: ["DEL cl:zr-none"]
    command: "ZRANK cl:zr-none m WITHSCORE"
    policy: exact
    contexts: [standalone, pipeline]

  - name: parity_zrevrank_withscore_absent_key_is_null_array
    setup: ["DEL cl:zr-none2"]
    command: "ZREVRANK cl:zr-none2 m WITHSCORE"
    policy: exact
    contexts: [standalone, pipeline]

  - name: parity_zrank_withscore_absent_member_is_null_array
    setup: ["DEL cl:zr3", "ZADD cl:zr3 1 m"]
    command: "ZRANK cl:zr3 nosuch WITHSCORE"
    policy: exact
    contexts: [standalone, pipeline]

  # The fence: WITHOUT the option the same miss is a null BULK, not a null
  # array. Without this row, "make every ZRANK miss *-1" would pass.
  - name: parity_zrank_without_withscore_miss_is_null_bulk
    setup: ["DEL cl:zr4", "ZADD cl:zr4 1 m"]
    command: "ZRANK cl:zr4 nosuch"
    policy: exact
    contexts: [standalone, pipeline]
