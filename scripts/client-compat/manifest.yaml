# Client-compat manifest — Moon vs a real redis-server.
#
# Breadth strategy (frozen at the contract): HARD CASES FIRST. The first block
# targets the replies most likely to falsify the five-policy normalization model
# — if the model is wrong, it must break here, before breadth is added on top of
# it. The rest reproduces the defects the 2026-08 client/SDK deep review found,
# so each wave-2 task has a wire-level reproduction to work against.
#
# policy: exact | sorted | type_only | numeric_tolerance | ignore_value
#
# expect_diff.reason is REQUIRED whenever expect_diff is present — an
# unexplained waiver is exactly the silent pass this harness exists to prevent.
# The waivers below are the BASELINE recorded on the harness's first full run
# (2026-08-09, oracle redis 8.6.1, moon 0.8.5+): every one is a real, reproduced
# divergence owned by a named wave-2 task. They make CI a ratchet — a NEW
# divergence fails the job, and `--strict` fails the moment a waived one is
# fixed, so a waiver cannot rot into a permanent blind spot.

entries:

  # ── Hard cases: legitimate non-determinism ────────────────────────────
  # These exist to falsify the policy model. Where they carry a waiver it is
  # for a REAL type divergence, never because normalization fell short.

  - name: hard_ttl_drift
    setup: ["SET k v", "EXPIRE k 100"]
    command: "TTL k"
    policy: numeric_tolerance
    tolerance: 5

  - name: hard_pttl_drift
    setup: ["SET k v", "PEXPIRE k 100000"]
    command: "PTTL k"
    policy: numeric_tolerance
    tolerance: 5000

  - name: hard_scan_cursor
    setup: ["MSET a 1 b 2 c 3"]
    command: "SCAN 0"
    policy: type_only

  - name: hard_randomkey
    setup: ["MSET a 1 b 2 c 3"]
    command: "RANDOMKEY"
    policy: type_only

  - name: hard_srandmember
    setup: ["DEL s", "SADD s a b c"]
    command: "SRANDMEMBER s"
    policy: type_only

  - name: hard_unordered_smembers
    setup: ["DEL s", "SADD s a b c"]
    command: "SMEMBERS s"
    policy: sorted
    expect_diff:
      reason: >-
        RESP3 inside MULTI only. Redis returns a Set (~3) from EXEC; Moon
        returns a flat Array (*3). Outside MULTI Moon converts correctly, so
        this is the EXEC-inner-reply gap: apply_resp3_conversion is called from
        11 sites across 3 handlers rather than one choke point, and the EXEC
        path is one of the misses. Owner: resp3-type-fidelity.

  - name: hard_unordered_hgetall
    setup: ["DEL h", "HSET h f1 v1 f2 v2"]
    command: "HGETALL h"
    policy: sorted
    expect_diff:
      reason: >-
        Same EXEC-inner-reply gap as hard_unordered_smembers: RESP3 HGETALL is
        a Map outside MULTI and a flat Array inside EXEC.
        Owner: resp3-type-fidelity.

  - name: hard_float_formatting
    setup: ["SET f 10.5"]
    command: "INCRBYFLOAT f 0.1"
    policy: numeric_tolerance
    tolerance: 0.0001
    expect_diff:
      reason: >-
        RESP3 only, and two defects at once. Redis answers Bulk
        "10.59999999999999964"; Moon answers Double ,10.6 — wrong TYPE
        (INCRBYFLOAT must stay Bulk) and a lossy value. RESP2 passes under the
        tolerance policy, which is the evidence that the policy model itself is
        sound here. Owner: resp3-type-fidelity.

  - name: hard_zscore_float
    setup: ["DEL z", "ZADD z 1.5 a"]
    command: "ZSCORE z a"
    policy: numeric_tolerance
    tolerance: 0.0001
    expect_diff:
      reason: >-
        RESP3 inside MULTI only: Redis returns Double ,1.5 from EXEC, Moon
        returns Bulk $3 1.5. Outside MULTI Moon converts correctly — the
        EXEC-inner-reply gap again. Owner: resp3-type-fidelity.

  # ── Transaction integrity ─────────────────────────────────────────────

  # Found by this harness 2026-08-09 and FIXED in the same v0.8.6 hotfix
  # (PR #457): GET inside MULTI was answered by the inline fast path instead of
  # queued, so EXEC returned *0. The waiver that recorded it went stale the
  # moment the fix landed and --strict said so by name — which is the whole
  # point of the mechanism. Kept unwaived as the permanent regression guard.
  - name: multi_get_must_queue
    setup: ["SET k v"]
    command: "GET k"
    policy: exact

  - name: multi_queues_config_get
    command: "CONFIG GET maxmemory"
    policy: type_only
    expect_diff:
      reason: >-
        FOUND BY THIS HARNESS, 2026-08-09. CONFIG GET inside MULTI is not
        queued either — EXEC returns *0. A second command family bypassing
        transaction queueing, distinct from the inline-GET path.
        Owner: resp3-type-fidelity (transaction queueing sweep).

  - name: multi_aborts_on_unknown_command
    command: "THISCOMMANDDOESNOTEXIST"
    policy: exact
    expect_diff:
      reason: >-
        Redis fails the queue-time error and then answers EXEC with
        -EXECABORT "Transaction discarded because of previous errors."; Moon
        queues the bad command and surfaces the -ERR from inside EXEC instead.
        A client that relies on EXECABORT to detect a poisoned transaction sees
        a partially-applied one. Owner: resp3-type-fidelity.

  - name: multi_aborts_on_wrong_arity
    command: "GET"
    policy: exact
    expect_diff:
      reason: >-
        Same EXECABORT gap as multi_aborts_on_unknown_command, reached through
        an arity error rather than an unknown name.
        Owner: resp3-type-fidelity.

  # ── RESP3 reply-type fidelity (review findings, wire-confirmed) ───────

  - name: type_sismember_is_integer
    setup: ["DEL s", "SADD s a"]
    command: "SISMEMBER s a"
    policy: exact
    expect_diff:
      reason: >-
        RESP3: Redis answers Integer :1, Moon over-converts to Boolean #t.
        Note resp3/multi passes only by accident — inside EXEC Moon does not
        convert at all, so the two bugs cancel. Owner: resp3-type-fidelity.

  - name: type_expire_is_integer
    setup: ["SET k v"]
    command: "EXPIRE k 100"
    policy: exact
    expect_diff:
      reason: >-
        RESP3: Redis answers Integer :1, Moon over-converts to Boolean #t.
        Same class as type_sismember_is_integer. Owner: resp3-type-fidelity.

  - name: type_incrbyfloat_is_bulk
    setup: ["SET f 1"]
    command: "INCRBYFLOAT f 1"
    policy: type_only
    expect_diff:
      reason: >-
        RESP3: INCRBYFLOAT must stay Bulk; Moon answers Double.
        Owner: resp3-type-fidelity.

  - name: shape_hrandfield_withvalues_is_pair_array
    setup: ["DEL h", "HSET h f1 v1"]
    command: "HRANDFIELD h 1 WITHVALUES"
    policy: sorted
    expect_diff:
      reason: >-
        RESP3: Redis answers an Array of pair Arrays (*1[*2[f1,v1]]); Moon
        answers a Map (%1). The Map-vs-pairs inversion the deep review flagged,
        now wire-confirmed. Owner: resp3-type-fidelity.

  - name: shape_zrandmember_withscores_is_pair_array
    setup: ["DEL z", "ZADD z 1 a"]
    command: "ZRANDMEMBER z 1 WITHSCORES"
    policy: sorted
    expect_diff:
      reason: >-
        Same Map-vs-pairs inversion as HRANDFIELD WITHVALUES.
        Owner: resp3-type-fidelity.

  - name: shape_zrange_withscores
    setup: ["DEL z", "ZADD z 1 a 2 b"]
    command: "ZRANGE z 0 -1 WITHSCORES"
    policy: exact
    expect_diff:
      reason: >-
        RESP3: Redis pair-wraps and sends Double scores
        (*2[*2[a,,1],*2[b,,2]]); Moon sends a flat Array of Bulks (*4). Missing
        pair-wrapping AND missing Double. Owner: resp3-type-fidelity.

  - name: shape_zpopmin
    setup: ["DEL z", "ZADD z 1 a 2 b"]
    command: "ZPOPMIN z"
    policy: exact
    expect_diff:
      reason: >-
        RESP3: the score must be a Double (,1); Moon sends Bulk $1 1.
        Owner: resp3-type-fidelity.

  - name: shape_spop_with_count_is_set
    setup: ["DEL s", "SADD s a b c"]
    command: "SPOP s 2"
    policy: type_only
    expect_diff:
      reason: >-
        RESP3: SPOP <count> must be a Set (~2); Moon sends an Array (*2).
        Policy is type_only, not sorted, because SPOP returns RANDOM members —
        the two servers legitimately pop different elements, so values can
        never be compared. Owner: resp3-type-fidelity.

  - name: shape_xinfo_stream
    setup: ["DEL st", "XADD st '*' f v"]
    command: "XINFO STREAM st"
    policy: type_only
    expect_diff:
      reason: >-
        RESP3: Redis answers a Map (%16); Moon answers a flat Array (*14) and
        is also missing fields. Owner: resp3-type-fidelity.

  - name: config_get_resp3_is_a_map
    command: "CONFIG GET maxmemory"
    policy: type_only
    protocols: [resp3]
    contexts: [standalone, pipeline]
    expect_diff:
      reason: >-
        RESP3: CONFIG GET must be a Map (%1); Moon answers a flat Array. CONFIG
        replies are not routed through apply_resp3_conversion at all.
        (The maxmemory VALUE also differs — Redis 0 vs Moon's auto-set 75% of
        RAM — which is intentional Moon behaviour, hence type_only.)
        Owner: resp3-type-fidelity.

  # ── Identity & introspection (review findings, wire-confirmed) ────────

  - name: identity_command_count
    command: "COMMAND COUNT"
    policy: type_only
    expect_diff:
      reason: >-
        Redis answers Integer :274; Moon answers an empty Array *0 — it ignores
        the COUNT subcommand and falls through to the bare COMMAND stub. A
        client using COMMAND COUNT to size its command table reads zero.
        Owner: client-identity-introspection.

  - name: identity_role
    command: "ROLE"
    policy: type_only
    expect_diff:
      reason: >-
        Redis answers *3[master, offset, replicas]; Moon answers
        -ERR unknown command 'ROLE'. Sentinel-aware and failover-aware clients
        call ROLE during topology discovery.
        Owner: client-identity-introspection.

  # ── Error-code parity (compared on the code, never the message) ───────

  # Waiver removed with the MULTI queueing fix: the MULTI legs used to diverge
  # only because the inline GET ran instead of queueing, emptying EXEC.
  - name: error_wrongtype
    setup: ["DEL k", "LPUSH k v"]
    command: "GET k"
    policy: exact
