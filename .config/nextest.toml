# cargo-nextest configuration (CI test runner — 2026-07-13 CI optimization
# round 2). Local `cargo test` still works; CI uses `cargo nextest run` for
# per-test-binary parallelism and automated flake retries.

[profile.default]
# Surface every failure in one run instead of stopping at the first failing
# test binary (parity with the Windows job's --no-fail-fast rationale).
fail-fast = false

[profile.ci]
# Known-flaky classes (fixed-port listeners, kill-9 timing under full-suite
# parallel load) get two automatic retries. A test that passes on retry is
# reported as FLAKY — the signal is kept, the manual reroll round-trip is not.
retries = 2
fail-fast = false
# Integration tests spawn real servers; a hung server must fail the test,
# not the 30-minute job budget.
slow-timeout = { period = "60s", terminate-after = 8 }

# Recall benchmarks are CPU-bound and seed-deterministic: a timeout means
# the machine is slow (or the test is mis-homed in the per-PR gate), and a
# recall-threshold failure reproduces identically — retrying either just
# multiplies the waste (a retried 480s timeout burned 24 min/test in the
# 2026-07-16 incident). Most are #[ignore]d out of per-PR runs entirely
# (nightly `recall-canaries` job); this override covers the per-PR smoke
# variants and the nightly job alike.
[[profile.ci.overrides]]
filter = 'test(/recall/)'
retries = 0
slow-timeout = { period = "120s", terminate-after = 5 }

# The idle-reclaim probe is a MEASUREMENT, not just a pass/fail gate: on Apple
# platforms it deliberately records whether the host reclaimed or retained
# rather than failing, because jemalloc's background_thread is compiled out
# there and no in-process remedy exists (see src/memory_ctl.rs). Captured
# stdout on a pass would discard the only number the test exists to produce,
# so surface it either way.
[[profile.ci.overrides]]
filter = 'test(/freed_memory_is_returned_to_the_os_when_idle/)'
success-output = "final"
